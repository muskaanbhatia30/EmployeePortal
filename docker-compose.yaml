version: "3.8"
services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - app_network
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  backend:
    build: ./project/backend
    ports:
      - "5050:5050"
    networks:
      - app_network
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/employees?authSource=admin
    depends_on:
      - mongodb

  frontend:
    build: ./project/frontend
    ports:
      - "5173:5173"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo-data:
